name: CD Lambda Auth and API Gateway

on:
  push:
    branches: [main, homologacao]
  workflow_dispatch:

permissions:
  contents: read

concurrency: terraform-lambda-auth-${{ github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'producao' || 'homologacao' }}
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - run: npm ci
      - run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="key=garage-flow/${{ github.ref_name == 'main' && 'producao' || 'homologacao' }}/lambda-auth.tfstate" -backend-config="region=${{ vars.AWS_REGION || 'us-east-2' }}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - run: terraform apply -auto-approve
        env:
          TF_VAR_db_user: ${{ secrets.DB_USER }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_datadog_api_key: ${{ secrets.DD_API_KEY }}
          TF_VAR_datadog_site: ${{ vars.DD_SITE || 'datadoghq.com' }}