name: CD Lambda Auth and API Gateway

on:
  push:
    branches: [main, homologacao]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'producao' || 'homologacao' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - run: npm ci
      - run: terraform init
      - run: terraform apply -auto-approve
        env:
          TF_VAR_lambda_subnet_ids: ${{ secrets.LAMBDA_SUBNET_IDS }}
          TF_VAR_lambda_security_group_ids: ${{ secrets.LAMBDA_SECURITY_GROUP_IDS }}
          TF_VAR_db_host: ${{ secrets.DB_HOST }}
          TF_VAR_db_name: ${{ secrets.DB_NAME }}
          TF_VAR_db_user: ${{ secrets.DB_USER }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}